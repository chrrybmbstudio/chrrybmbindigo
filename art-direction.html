<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>chrrybmb — Art Direction</title>
  <meta name="description" content="Navigate between Case Studies or Previous Designs — a hub for art direction projects." />
  <link rel="canonical" href="https://chrrybmb.com/art-direction.html" />

  <!-- Favicon / apple -->
  <link rel="icon" href="./assets/eyefavi.png">
  <link rel="apple-touch-icon" href="./assets/eyefavi.png">

  <!-- Base site CSS -->
  <link rel="stylesheet" href="/style.css?v=9">
  <link rel="stylesheet" href="/mobilestyle.css?v=1" media="(max-width:640px)">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Jacquarda+Bastarda+9&display=swap" rel="stylesheet" />

  <style>
    body.page-art{ display:flex; flex-direction:column; min-height:100svh; --orb-x:72%; --orb-y:68%; --lx:72%; --ly:68%; --lr:140px; background:#fefeff; overflow-x:hidden; }

    /* Wave + lens same as other pages */
    .iridescent-wave{ position: fixed; inset: 0; z-index: 0; pointer-events:none; overflow:hidden; transform: translateZ(0); contain:paint; backface-visibility:hidden; }
    .iridescent-wave::before{ content:""; position:absolute; left:-25vw; right:-25vw; top:-200vh; bottom:-200vh; background: conic-gradient(from var(--wave-rot,0deg) at var(--orb-x) var(--orb-y), rgba(127,240,255,.25), rgba(255,106,223,.20), rgba(127,240,255,.25)); filter: blur(54px) saturate(150%); mix-blend-mode: color-dodge; opacity:.72; animation: waveSpin 22s linear infinite; }
    .iridescent-wave::after{ content:""; position:absolute; left:-25vw; right:-25vw; top:-240vh; bottom:-240vh; background: radial-gradient(80% 60% at 50% 30%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%), linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 35%, rgba(255,255,255,0) 70%); filter: blur(18px); mix-blend-mode: soft-light; opacity:.35; animation: rippleDown 36s cubic-bezier(.42,0,.58,1) infinite; }
    @keyframes waveSpin{ to{ transform: rotate(1turn) } }
    @keyframes rippleDown{ 0%{transform:translate3d(0,-35%,0)} 100%{transform:translate3d(0,35%,0)} }
    @media (prefers-reduced-motion: reduce){ .iridescent-wave::before, .iridescent-wave::after{ animation:none !important } }

    .bg-art{ position: fixed; inset: 0; z-index: 0; pointer-events:none; overflow: visible; }
    .lens-glass{ position:absolute; left:var(--lx); top:var(--ly); width: calc(var(--lr)*2); height: calc(var(--lr)*2); transform: translate(-50%,-50%); border-radius:50%; backdrop-filter: blur(4px) saturate(125%) contrast(105%); -webkit-backdrop-filter: blur(4px) saturate(125%) contrast(105%); background: radial-gradient(closest-side, rgba(68,64,255,.10), rgba(68,64,255,0) 68%); }
    .lens-aura{ position:absolute; left:var(--lx); top:var(--ly); width:calc(var(--lr)*2.1); height:calc(var(--lr)*2.1); transform:translate(-50%,-50%); border-radius:50%; filter: blur(.6px) saturate(120%); pointer-events:none; }

    /* header */
    .site-header{ position:relative; z-index:6; }
    .header__inner{ display:flex; align-items:center; gap:12px; padding:12px 18px; max-width:1100px; margin:0 auto; }
    .brand__logo-img{ display:block }

    /* hero section */
    .art-hero{ position:relative; padding: calc(var(--page-ui,0.66) * clamp(18px,4.6vw,56px)) 20px 12px; text-align:center; z-index:5; }
    .hero-inner{ max-width:min(1100px,92vw); margin-inline:auto; }
    .hero-title{ font-family: "Funnel Display", system-ui, sans-serif; font-weight:700; font-size: calc(var(--page-ui) * clamp(30px,5.6vw,48px)); margin:0; letter-spacing:-.02em; line-height:1; text-transform: lowercase; }
    .hero-sub{ margin-top:8px; font: 400 calc(var(--page-ui) * clamp(16px,2.4vw,20px))/1.2 "Jacquarda Bastarda 9", serif; opacity:.88; max-width:820px; margin-left:auto; margin-right:auto; }

    /* cta hub buttons */
    .hub-cta{ display:flex; justify-content:center; gap:18px; margin-top:28px; flex-wrap:wrap; }
    .btn-pixel{ --px:10.5px; display:inline-flex; align-items:center; justify-content:center; gap:.4ch; padding:12px 20px; border-radius:10px; font:800 var(--px)/1 "Funnel Display"; text-transform:uppercase; letter-spacing:.12em; background: linear-gradient(180deg,#ffffff,#f6f6ff); border:1px solid #1f22ff; color:#1a1a2b; text-decoration:none; box-shadow: 0 0 0 1px rgba(68,64,255,.08) inset, 0 6px 18px rgba(68,64,255,.12); transition: transform .12s ease, box-shadow .12s ease; }
    .btn-pixel:hover{ transform:translateY(-2px); box-shadow:0 12px 32px rgba(68,64,255,.12); }
    .btn-pixel--ghost{ background:#fff; border-style:dashed; opacity:.94; }

    /* small responsive tweaks */
    @media (max-width:640px){ .hub-cta{ flex-direction:column; gap:12px; } }
  </style>
</head>
<body class="page-art">

  <!-- Wave + lens -->
  <div class="iridescent-wave" aria-hidden="true"></div>
  <div class="bg-art" aria-hidden="true">
    <span class="lens-glass"></span>
    <span class="lens-aura"></span>
  </div>

  <!-- Header -->
  <header class="site-header" role="banner" aria-hidden="false">
    <div class="header__inner" style="max-width:1100px;margin:0 auto;">
      <a class="brand" href="/"><img class="brand__logo-img" src="./assets/indigo_chrry_indypinky.svg" alt="chrrybmb logo" width="64" height="36" decoding="async"></a>
      <nav class="nav" aria-label="Primary" style="margin-left:auto">
        <ul class="nav__list" style="display:flex;gap:14px;align-items:center;margin:0;padding:0;list-style:none">
          <li><a href="/index.html">home</a></li>
          <li><a href="/about.html">about</a></li>
          <li><a href="/contact.html">contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="art-hero" aria-label="Art Direction">
    <div class="hero-inner" data-animate>
      <h1 class="hero-title">Art Direction</h1>
      <p class="hero-sub">Navigate to either Case Studies or Previous Designs to explore selected projects.</p>

      <div class="hub-cta">
        <a class="btn-pixel" href="./work.html">Case Studies</a>
        <a class="btn-pixel btn-pixel--ghost" href="./design.html">Previous Designs</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo" style="text-align:center;padding:20px 12px;">
    <span class="dot" aria-hidden="true"></span>
    <small>© <span id="year"></span> chrrybmb.com / denisajomo.com</small>
  </footer>

  <script>
    // set year
    document.getElementById('year').textContent = new Date().getFullYear();

    // pointer variables drive --orb-x/--orb-y and --lx/--ly
    (function(){
      const host = document.querySelector('.page-art') || document.body;
      host.style.setProperty('--orb-x','72%'); host.style.setProperty('--orb-y','68%');
      host.style.setProperty('--lx','72%'); host.style.setProperty('--ly','68%');
      let raf=0;
      function onPoint(e){
        const t = e.touches ? e.touches[0] : e;
        const x = (t.clientX / innerWidth) * 100;
        const y = (t.clientY / innerHeight) * 100;
        if(raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(()=>{
          host.style.setProperty('--orb-x', x.toFixed(2)+'%');
          host.style.setProperty('--orb-y', y.toFixed(2)+'%');
          host.style.setProperty('--lx', x.toFixed(2)+'%');
          host.style.setProperty('--ly', y.toFixed(2)+'%');
        });
      }
      addEventListener('pointermove', onPoint, {passive:true});
      addEventListener('touchmove', onPoint, {passive:true});
    })();

    // intersection reveal
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target) }
      });
    },{ threshold:.12 });
    document.querySelectorAll('[data-animate]').forEach(el=>io.observe(el));
  </script>

  <script type="module" src="./site.js" defer></script>
</body>
</html>
